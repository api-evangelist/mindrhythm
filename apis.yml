aid: mindrhythm
name: MindRhythm
description: >-
  MindRhythm is a medical technology company focused on improving outcomes caused
  by neurological injury. Founded by scientific experts with prior commercialization
  success, the company builds a detection and monitoring platform — anchored by its
  Headpulse technology — that provides real-time visibility into life-threatening
  neurological events such as large-vessel-occlusion stroke and concussion, across
  the home, EMS, battlefield, and clinical settings. MindRhythm publishes clinical
  studies, news, and company/leadership information on its site; it does not expose a
  public developer API, SDK, or API documentation surface at this time.
